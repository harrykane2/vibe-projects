<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Рядом</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="account-page">
      <nav class="top-nav" aria-label="Навигация">
        <a href="/">Рядом</a>
        <a href="/applications.html">Заявки</a>
      </nav>

      <section class="form-card login-card" aria-labelledby="login-title">
        <h1 id="login-title">Вход в «Рядом»</h1>
        <form id="login-form">
          <div class="field">
            <label for="email">Электронная почта</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">Войти</button>
        </form>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
